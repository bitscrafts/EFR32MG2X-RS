[package]
name = "bootloader-test-app"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
panic-halt = "0.2"
efr32mg24-pac = { path = "../efr32mg24-pac" }

[profile.release]
debug = true
lto = true
opt-level = "z"  # Optimize for size
codegen-units = 1
