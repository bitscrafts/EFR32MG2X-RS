[package]
name = "efr32mg24-bootloader"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitscrafts/EFR32MG2X-RS"
authors = ["Marcelo Correa <mvcorrea+github@gmail.com>"]

[[bin]]
name = "efr32mg24-bootloader"
path = "src/main.rs"

[dependencies]
# Minimal dependencies for bootloader
# Note: We avoid cortex-m to prevent linker script conflicts

# Panic handler
panic-halt = "0.2"

[dev-dependencies]
# For test application example
cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"

[profile.release]
opt-level = "z"          # Optimize for size
lto = "fat"              # Link-time optimization
codegen-units = 1        # Single codegen unit for better optimization
strip = true             # Strip symbols
panic = "abort"          # Smaller panic handler
overflow-checks = false  # Disable overflow checks
debug = false            # No debug info

[profile.release.package."*"]
opt-level = "z"          # Optimize all dependencies for size
