name: Build and Test

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    name: Gate (build, clippy, host tests, examples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Both targets are needed: the firmware crates build for the microcontroller, and the pure-logic crates under
      # `libraries/` are tested on the host — an allocator or a cipher is proven by running it, not by compiling it.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv8m.main-none-eabihf

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            targets
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # **The same script that runs locally.** One definition of "the project is healthy" is worth more than a workflow
      # that drifts from it: the previous version of this job ran `cargo test ... || echo "Tests placeholder"`, which
      # cannot fail, and built examples without the features they require.
      # Run once, keep the full log, and let the step's exit status be the gate's verdict. Running it twice to print a
      # summary would double the CI time for a tail of output that the first run already produced.
      - name: Run the gate
        run: |
          set -o pipefail
          bash scripts/gate.sh 2>&1 | tee gate.log

      - name: Upload the gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-log
          path: gate.log
