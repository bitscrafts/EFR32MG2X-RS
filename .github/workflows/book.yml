name: Book (PDF)

# The book is built from the same sources as the code, so it is built on every push rather than shipped
# as an opaque blob: a chapter that stops compiling is a chapter that has rotted.
#
# The compile runs inside the same TeX Live image the bench uses, not in a hand-assembled apt package
# list. The first attempt did the latter and died on the third missing .sty -- a runner whose TeX differs
# from the bench proves nothing about the book, it proves something about the runner.
on:
  push:
    branches: [master, main]
    paths:
      - "book/**"
      - ".github/workflows/book.yml"
  pull_request:
    paths:
      - "book/**"
  workflow_dispatch:

jobs:
  build:
    name: Build the book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the sources before compiling
        run: python3 book/check-tex.py

      - name: Check that the printed code parses
        # A book about bring-up that prints code nobody compiled is fiction, and the rot is silent: the PDF still
        # builds and the pages still look right. Fragments are expected to be fragments; the check is that they are
        # valid ones, and that the abridged listings say so.
        run: python3 book/check-code-blocks.py

      - name: Check that the references point at something
        # A \ref with no \label prints "??" and LaTeX carries on, and a path named in prose can point at a file
        # that was renamed. Both are invisible in the PDF until a reader tries to use them.
        run: python3 book/check-refs.py

      - name: Compile twice so the contents and cross-references settle
        run: |
          docker run --rm -v "$PWD":/work -w /work/book/latex \
            docker.io/texlive/texlive:latest \
            sh -c 'xelatex -shell-escape -interaction=nonstopmode main.tex > pass1.log 2>&1; \
                   xelatex -shell-escape -interaction=nonstopmode main.tex > pass2.log 2>&1; \
                   tail -3 pass2.log; ls -l main.pdf'

      - name: Refuse an implausible result
        # A LaTeX run can exit 0 and still produce a title page with no book behind it. The "Output
        # written on main.pdf (N pages)" line is the compiler's own count.
        run: |
          pages=$(sed -n 's/.*Output written on main\.pdf (\([0-9]*\) pages.*/\1/p' book/latex/pass2.log | tail -1)
          echo "pages=${pages:-none}"
          test -n "${pages}" || { echo "no page count: the compile did not finish"; tail -40 book/latex/pass2.log; exit 1; }
          test "${pages}" -gt 100 || { echo "implausible page count: ${pages}"; exit 1; }

      - name: Upload the PDF
        uses: actions/upload-artifact@v4
        with:
          name: EFR32MG24-Embedded-Rust-Book
          path: book/latex/main.pdf
          retention-days: 90

      - name: Upload the LaTeX logs when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: book-latex-log
          path: book/latex/*.log
          if-no-files-found: ignore
          retention-days: 7
