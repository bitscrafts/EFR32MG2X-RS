[package]
name = "efr32mg24-bluetooth-sys"
version = "0.1.0"
authors = ["Marcelo Correa <mvcorrea+github@gmail.com>"]
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Low-level FFI bindings to Silicon Labs Bluetooth stack (BGAPI) for EFR32MG24"
repository = "https://github.com/bitscrafts/EFR32MG2X-RS"
readme = "README.md"
keywords = ["efr32", "bluetooth", "ble", "embedded", "no-std"]
categories = ["embedded", "hardware-support", "no-std"]

[dependencies]
efr32mg24-hal = { path = "../efr32mg24-hal", features = ["rt"] }
aes-ctr-radio = { path = "../../libraries/aes-ctr-radio" }
aes-modes = { path = "../../libraries/aes-modes" }
# P-256 for the security manager's LE Secure Connections: ECDH and public-key export, in Rust.
p256 = { version = "0.13", default-features = false, features = ["ecdh"] }
efr32mg24-emlib-sys = { path = "../efr32mg24-emlib-sys" }
bt-heap = { path = "../../libraries/bt-heap" }
# AES-CTR for the controller, in Rust: libraries/aes-ctr-radio holds the implementation and its
# FIPS-197 test, so the crypto is testable here instead of trusted as a vendor blob.
# The CORE_* helpers the vendor blobs reference; compiled once for the whole workspace.
cmsis-stubs = { path = "../cmsis-stubs" }
# The Bluetooth controller is built on RAIL: its chip layer calls RAIL_ConfigAntenna and friends.
# This is the vendor's own layering, discovered by the linker rather than by a document.
efr32mg24-rail-sys = { path = "../efr32mg24-rail-sys" }
# Core types for FFI
cty = "0.2"

# Safe wrapper dependencies
heapless = "0.8"
embedded-hal = "1.0"
# Register access for the Secure Engine TRNG: the PAC carries the SVD-generated types, so no register offset
# is ever written by hand in this crate.
efr32mg24-pac = { path = "../efr32mg24-pac" }

[dev-dependencies]
# Required for examples
cortex-m = "0.7"
cortex-m-rt = "0.7"
panic-halt = "0.2"
efr32mg24-pac = { path = "../efr32mg24-pac" }

[build-dependencies]
cc = "1"
# For generating Rust bindings from C headers
bindgen = "0.69"
# For verifying Bluetooth blob integrity
sha2 = "0.10"

[[example]]
name = "bt_version"

[features]
# No default features
default = []
# `core::error::Error` is only implemented behind this feature; the crate is otherwise no_std.
std = []

[package.metadata.docs.rs]
# Don't attempt to build blobs on docs.rs
default-target = "thumbv8m.main-none-eabihf"
targets = []  # Don't build for other targets
rustdoc-args = ["--cfg", "docsrs"]  # Enable doc features
