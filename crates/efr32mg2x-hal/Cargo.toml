[package]
name = "efr32mg2x-hal"
# Not for the registry until the operator says so, in an express order in the conversation where it happens
# (`CLAUDE.md`, HARD RULE "no publication without an express order"). Lifting this line is the visible act of
# publishing; the gate fails while it is absent from any package.
publish = false
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Hardware Abstraction Layer for EFR32MG24 microcontrollers"
keywords = ["arm", "cortex-m", "efr32", "silabs", "embedded-hal"]
categories = ["embedded", "hardware-support", "no-std"]

[dependencies]
efr32mg2x-pac = { path = "../efr32mg2x-pac", version = "0.1.1" }
# No `critical-section-single-core` here. That feature names a *provider* of the critical-section API, and a library
# that selects one for its users takes the choice away from them: an application with an RTOS, or with TrustZone
# splitting the two worlds, brings its own provider and would hit duplicate symbols at link time. The HAL needs
# `cortex-m`; it does not need to decide who implements a critical section. The examples and tests still link,
# because they are applications and a provider is declared for them below. (An outside review found this on
# 2026-11-27, B3; `efr32mg2x-pac` already had it right, in dev-dependencies.)
cortex-m = { workspace = true }
embedded-hal = { workspace = true }
critical-section = { workspace = true }
nb = "1.1"
embedded-hal-nb = "1.0"
embedded-hal-async = "1"

[dependencies.cortex-m-rt]
workspace = true
optional = true

[features]
default = ["mg24"]
# The device, forwarded to the PAC. Turning it off without naming another one fails to compile inside the PAC, which is
# where the register map lives -- no second guard is needed here.
mg24 = ["efr32mg2x-pac/mg24"]
rt = ["efr32mg2x-pac/rt", "cortex-m-rt"]

[dev-dependencies]
# Examples are applications: they may compose the HAL with an algorithm crate.
# The dependency never goes the other way — the HAL does not know what a fall is.
cortex-m-rt = { workspace = true, default-features = false }
# The provider of `critical-section` for the examples and the host tests: an application picks one, a library does
# not. This is the same line the PAC carries in its dev-dependencies.
cortex-m = { workspace = true, features = ["critical-section-single-core"] }
panic-halt = "0.2"
# Diagnostics for the examples, not a dependency of the HAL: deferred formatting keeps the format strings on the host,
# and panic-probe prints the panic with a backtrace over the same SWD cable that flashes the board.
defmt = "1.2"
defmt-rtt = { version = "1.3", default-features = false }
panic-probe = { version = "1.0", features = ["print-defmt"] }

[build-dependencies]

# The fall detector is written as a project (main + app + ui + recorded), not a
# single file, because the whole application lives there.


[package.metadata.docs.rs]
targets = ["thumbv8m.main-none-eabihf"]
rustdoc-args = ["--cfg", "docsrs"]
