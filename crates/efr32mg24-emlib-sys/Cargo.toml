[package]
name = "efr32mg24-emlib-sys"
version = "0.1.0"
edition = "2021"
description = "The three emlib units the EFR32MG24 radio blobs link against (Silicon Labs, Zlib)"
license = "Zlib"
publish = false
links = "emlib_min"

[build-dependencies]
cc = "1.0"

[dev-dependencies]
# The example needs a board to read the DWT counter and a delay to measure the clock against. That is
# a dev-dependency on purpose: nothing in the radio path should depend on the HAL.
efr32mg24-hal = { path = "../efr32mg24-hal", features = ["rt"] }
panic-halt = "0.2"
