[package]
name = "efr32mg2x-pac"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Peripheral Access Crate for EFR32MG24 microcontrollers"
keywords = ["arm", "cortex-m", "efr32", "silabs", "embedded"]
categories = ["embedded", "hardware-support", "no-std"]
readme = "README.md"
# The SVD is the input to svd2rust, not an input to the build: 5.7 MB that every user would download
# and never read.
exclude = ["svd/"]

[lib]
# The package name is the crates.io name; this is what `use` sees. Kept explicit so a rename of the
# package can never silently break every dependent's import.
name = "efr32mg24_pac"

[dependencies]
cortex-m = { workspace = true }
vcell = "0.1.3"
portable-atomic = { version = "1.10.0", default-features = false }

[dependencies.critical-section]
workspace = true
optional = true

[dependencies.cortex-m-rt]
workspace = true
optional = true

[features]
default = ["critical-section"]
rt = ["cortex-m-rt/device"]
critical-section = ["dep:critical-section"]

[dev-dependencies]
cortex-m-rt = { workspace = true }
panic-halt = "0.2"
# Provide the critical-section implementation for examples so the PAC's
# svd2rust-generated `modify` (which uses critical_section) can link.
cortex-m = { workspace = true, features = ["critical-section-single-core"] }

[build-dependencies]

[package.metadata.docs.rs]
# A bare `cargo doc` on the host builds the crate but the target is the interesting part: docs.rs must use the
# Cortex-M33 target, and `docsrs` is what the generated `cfg_attr(docsrs, ...)` expects.
targets = ["thumbv8m.main-none-eabihf"]
rustdoc-args = ["--cfg", "docsrs"]
