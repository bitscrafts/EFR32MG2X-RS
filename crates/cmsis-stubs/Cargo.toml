[package]
name = "efr32mg2x-cmsis-stubs"
# The toolchain this workspace is built and measured with (rustc 1.95.0, 2026-04-14). Not a guess at the
# oldest that might work: nothing below it has been compiled here, and an unproven MSRV is a promise.
rust-version = "1.95"
# Not for the registry: see `scripts/check-publishable.py` for the two crates that may ship.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CMSIS core helpers the Silicon Labs radio blobs expect the application to provide"
readme = "README.md"

[lib]
name = "cmsis_stubs"

[dependencies]

[build-dependencies]
cc = "1"
