[package]
name = "efr32mg2x-pac"
# The toolchain this workspace is built and measured with (rustc 1.95.0, 2026-04-14). Not a guess at the
# oldest that might work: nothing below it has been compiled here, and an unproven MSRV is a promise.
rust-version = "1.95"
# Not for the registry until the operator says so, in an express order in the conversation where it happens
# (`CLAUDE.md`, HARD RULE "no publication without an express order"). Lifting this line is the visible act of
# publishing; the gate fails while it is absent from any package.
publish = false
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Peripheral Access Crate for EFR32MG24 microcontrollers"
keywords = ["arm", "cortex-m", "efr32", "silabs", "embedded"]
categories = ["embedded", "hardware-support", "no-std"]
readme = "README.md"
# The SVD is the input to svd2rust, not an input to the build: 5.7 MB that every user would download
# and never read.
exclude = ["svd/"]

# No [lib] name section: the library takes the package name (efr32mg2x_pac), so what `use` reads and what
# Cargo.toml says are the same word.

[dependencies]
cortex-m = { workspace = true }
vcell = "0.1.3"
portable-atomic = { version = "1.10.0", default-features = false }

[dependencies.critical-section]
workspace = true
optional = true

[dependencies.cortex-m-rt]
workspace = true
optional = true

[features]
# The device. One today: the EFR32MG24B220F1536IM48 on the XIAO MG24 Sense. It is a feature rather than part of the
# crate name so that a second part (an MG21, another flash size) is added here instead of forking the crate, and so
# that `default-features = false` without a device fails to compile instead of giving you a register map that is not
# yours.
mg24 = []
default = ["mg24", "critical-section"]
rt = ["cortex-m-rt/device"]
critical-section = ["dep:critical-section"]

[dev-dependencies]
cortex-m-rt = { workspace = true }
panic-halt = "0.2"
# Provide the critical-section implementation for examples so the PAC's
# svd2rust-generated `modify` (which uses critical_section) can link.
cortex-m = { workspace = true, features = ["critical-section-single-core"] }
# Diagnostics for the examples: deferred formatting keeps the strings on the host, and panic-probe prints the panic with
# a backtrace over the SWD cable that flashed the board.
defmt = "1.2"
defmt-rtt = { version = "1.3", default-features = false }
panic-probe = { version = "1.0", features = ["print-defmt"] }

[build-dependencies]

[package.metadata.docs.rs]
# A bare `cargo doc` on the host builds the crate but the target is the interesting part: docs.rs must use the
# Cortex-M33 target, and `docsrs` is what the generated `cfg_attr(docsrs, ...)` expects.
targets = ["thumbv8m.main-none-eabihf"]
rustdoc-args = ["--cfg", "docsrs"]
