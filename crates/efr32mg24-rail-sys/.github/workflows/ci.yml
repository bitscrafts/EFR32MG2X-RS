name: CI

on:
  push:
    branches: [ master, main ]
    paths:
      - 'efr32mg24-rail-sys/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'efr32mg24-rail-sys/**'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv8m.main-none-eabihf
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: efr32mg24-rail-sys/target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Check format
        run: |
          cd efr32mg24-rail-sys
          cargo fmt -- --check

      - name: Clippy (without blobs)
        run: |
          cd efr32mg24-rail-sys
          cargo clippy --target thumbv8m.main-none-eabihf -- -D warnings

      - name: Check build (graceful degradation)
        run: |
          cd efr32mg24-rail-sys
          # Verify crate compiles even without vendor files
          cargo check --target thumbv8m.main-none-eabihf

      - name: Check documentation
        run: |
          cd efr32mg24-rail-sys
          cargo doc --target thumbv8m.main-none-eabihf --no-deps

