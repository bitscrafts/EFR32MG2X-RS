[package]
name = "embassy-efr32"
# The toolchain this workspace is built and measured with (rustc 1.95.0, 2026-04-14). Not a guess at the
# oldest that might work: nothing below it has been compiled here, and an unproven MSRV is a promise.
rust-version = "1.95"
# Not for the registry: see `scripts/check-publishable.py` for the two crates that may ship.
publish = false
description = "Embassy time driver for Silicon Labs EFR32MG24, on top of efr32mg2x-hal"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
embassy-time-driver = "0.2"
critical-section = "1"
cortex-m = "0.7"

[dev-dependencies]
# The provider of `critical-section` for this crate's examples: an application chooses one, a library does not.
# `efr32mg2x-hal` stopped selecting it for its consumers on 2026-11-27 (B3), so every application in this
# workspace that links a binary declares it here.
cortex-m = { workspace = true, features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
panic-halt = "0.2"

[features]
default = []
# Installs the `time_driver_impl!` instance so `embassy-time` finds this driver.
driver = []
