[package]
name = "efr32mg2x-bootloader-test-app"
# The toolchain this workspace is built and measured with (rustc 1.95.0, 2026-04-14). Not a guess at the
# oldest that might work: nothing below it has been compiled here, and an unproven MSRV is a promise.
rust-version = "1.95"
# Not for the registry: see `scripts/check-publishable.py` for the two crates that may ship.
publish = false
version = "0.1.0"
edition = "2021"

[lib]
name = "bootloader_test_app"

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
panic-halt = "0.2"
efr32mg2x-pac = { path = "../efr32mg2x-pac" }

[profile.release]
debug = true
lto = true
opt-level = "z"  # Optimize for size
codegen-units = 1
