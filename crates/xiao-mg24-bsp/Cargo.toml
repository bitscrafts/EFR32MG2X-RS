[package]
name = "efr32mg2x-xiao-bsp"
version = "0.1.0"
authors = ["Marcelo Correa <mvcorrea+github@gmail.com>"]
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Board Support Package for Seeed Studio XIAO MG24 Sense (EFR32MG24B220F1536IM48-B)"
repository = "https://github.com/bitscrafts/EFR32MG2X-RS"
readme = "README.md"
keywords = ["xiao", "efr32", "mg24", "embedded", "no-std"]
categories = ["embedded", "hardware-support", "no-std"]

[lib]
name = "xiao_mg24_bsp"

[dependencies]
# HAL dependencies
efr32mg2x-hal = { package = "efr32mg2x-hal", path = "../efr32mg2x-hal", features = ["rt"] }
efr32mg2x-pac = { path = "../efr32mg2x-pac" }

# Cortex-M dependencies
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }

# embedded-hal traits
embedded-hal = { workspace = true }

# Critical section support
critical-section = { workspace = true }

# No-heap data structures
heapless = "0.8"

# Radio protocol implementations
efr32mg24-bluetooth-sys = { package = "efr32mg2x-bluetooth-sys", path = "../efr32mg24-bluetooth-sys", optional = true }  # Phase D2 complete
# efr32mg24-zigbee-sys = { workspace = true, optional = true }     # Phase D3

[dev-dependencies]
# Only for `module_ble_beacon`: the radio stack is three MSLA blobs, and a user of a GPIO must not
# inherit them. The example opts in; the crate does not.
efr32mg24-radio = { package = "efr32mg2x-radio", path = "../efr32mg24-radio" }
# The classifier is hardware-free policy: the BLE fall example is an application of it.
motion-detection = { package = "efr32mg2x-motion-detection", path = "../../libraries/motion-detection" }
panic-halt = "0.2"

[features]
external-bonding = ["efr32mg24-radio/external-bonding"]
stack = ["efr32mg24-radio/stack"]  # BLE examples: the link-layer handler lives behind this feature
default = []
# The Sense variant is the same PCB with more components fitted: the IMU and the analog
# microphone. Same board, fewer parts — so a feature, not a crate.
sense = []
# radio-zigbee = ["radio", "efr32mg24-zigbee-sys"]      # Phase D3 (future)

[package.metadata.docs.rs]
default-target = "thumbv8m.main-none-eabihf"
targets = ["thumbv8m.main-none-eabihf"]

# The Sense examples need the feature: without it they are skipped rather than failing, so a
# reader with a plain MG24 module gets a clean absence instead of a confusing error.

# The Sense examples: same board with more parts fitted, so the feature is what gates them.
[[example]]
name = "module_imu"
required-features = ["sense"]

[[example]]
name = "module_mic_level"
required-features = ["sense"]

[[example]]
name = "module_ble_motion"
required-features = ["sense", "stack"]

[[example]]
name = "module_ble_fall"
required-features = ["sense", "stack"]

[[example]]
name = "module_ble_beacon"
required-features = ["stack"]

# The dosimeter service needs the link-layer handler, like the other BLE examples, and it needs the external bonding
# database: with the stack's built-in one the bond is stored and then not found after a reset (vendor defect, measured
# 2026-11-17 -- `rsn=0x1006` on a key that is present in flash). Declaring the feature here means a plain
# `cargo build --example module_ble_dosimeter` refuses instead of silently producing a device that forgets the phone.
[[example]]
name = "module_ble_dosimeter"
required-features = ["stack", "sense", "external-bonding"]

[[example]]
name = "module_heap_probe"
required-features = ["stack"]

[[example]]
name = "module_pairing_probe"
required-features = ["stack"]

[[example]]
name = "module_dev_scan"
required-features = ["stack"]

[[example]]
name = "module_dosimeter_offline"
required-features = ["sense"]

[[example]]
name = "module_nvm3_wipe"
required-features = ["sense", "stack"]

[[example]]
name = "module_nvm3_probe"
required-features = ["stack"]

