[package]
name = "xiao-mg24-bsp"
version = "0.1.0"
authors = ["Marcelo Correa <mvcorrea+github@gmail.com>"]
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Board Support Package for Seeed Studio XIAO MG24 Sense (EFR32MG24B220F1536IM48-B)"
repository = "https://github.com/bitscrafts/EFR32MG2X-RS"
readme = "README.md"
keywords = ["xiao", "efr32", "mg24", "embedded", "no-std"]
categories = ["embedded", "hardware-support", "no-std"]

[dependencies]
# HAL dependencies
efr32mg24-hal = { path = "../efr32mg24-hal", features = ["rt"] }
efr32mg24-pac = { path = "../efr32mg24-pac" }

# Cortex-M dependencies
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }

# embedded-hal traits
embedded-hal = { workspace = true }

# Critical section support
critical-section = { workspace = true }

# No-heap data structures
heapless = "0.8"

# Radio protocol implementations
efr32mg24-bluetooth-sys = { path = "../efr32mg24-bluetooth-sys", optional = true }  # Phase D2 complete
efr32mg24-rail-sys = { path = "../efr32mg24-rail-sys", optional = true }
# efr32mg24-zigbee-sys = { workspace = true, optional = true }     # Phase D3

[dev-dependencies]
panic-halt = "0.2"

[features]
default = []
# The Sense variant is the same PCB with more components fitted: the IMU and the analog
# microphone. Same board, fewer parts — so a feature, not a crate.
sense = []
# Radio features
radio = ["efr32mg24-rail-sys"]           # Phase D1 complete
ble = ["efr32mg24-bluetooth-sys"]        # Phase D2 complete
microphone = []                           # Microphone driver (has pre-existing PAC API issues)
# radio-zigbee = ["radio", "efr32mg24-zigbee-sys"]      # Phase D3 (future)

[package.metadata.docs.rs]
default-target = "thumbv8m.main-none-eabihf"
targets = ["thumbv8m.main-none-eabihf"]

# The Sense examples need the feature: without it they are skipped rather than failing, so a
# reader with a plain MG24 module gets a clean absence instead of a confusing error.

# The Sense examples: same board with more parts fitted, so the feature is what gates them.
[[example]]
name = "module_imu"
required-features = ["sense"]

[[example]]
name = "module_mic_level"
required-features = ["sense"]
