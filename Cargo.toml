[workspace]
resolver = "2"
# `crates/` is the hardware stack: PAC <- HAL <- BSP <- bindings, one direction only.
members = [
    "crates/cmsis-stubs",
    "crates/efr32mg24-pac",
    "crates/efr32mg24-hal",
    "crates/efr32mg24-emlib-sys",
    "crates/efr32mg24-rail-sys",
    "crates/efr32mg24-bluetooth-sys",
    "crates/efr32mg24-radio",
    "crates/xiao-mg24-bsp",
    "crates/xiao-expansion-base-bsp",
    # `libraries/` is domain policy: no hardware, builds and tests on the host.
    "libraries/motion-detection",
    "libraries/aes-ctr-radio",
]
exclude = [
    "crates/efr32mg24-bootloader",
    "crates/bootloader-test-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitscrafts/EFR32MG2X-RS"
authors = ["Marcelo Correa <mvcorrea+github@gmail.com>"]

[workspace.dependencies]
# Common dependencies
cortex-m = "0.7.7"
cortex-m-rt = { version = "0.7.3", default-features = false }
embedded-hal = "1.0.0"
critical-section = "1.2.0"

# Radio -sys crates (FFI bindings to Silicon Labs blobs)
efr32mg24-rail-sys = { version = "0.1.0", path = "efr32mg24-rail-sys" }
efr32mg24-bluetooth-sys = { version = "0.1.0", path = "efr32mg24-bluetooth-sys" }
# efr32mg24-zigbee-sys = { version = "0.1.0", path = "efr32mg24-zigbee-sys" }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
debug = true
