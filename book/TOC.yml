# Table of Contents for "Implementing Rust Support for Embedded Hardware"
# A Comprehensive Guide Based on EFR32MG24 Implementation

metadata:
  title: "Implementing Rust Support for Embedded Hardware: A Complete Guide Using EFR32MG24"
  subtitle: "From PAC Generation to Production-Ready HAL and Protocol Stacks"
  author: "Marcelo Correa"
  version: "1.0.0"
  target_audience: "Intermediate Rust developers new to embedded systems"
  prerequisites: "Basic Rust knowledge, familiarity with C optional but helpful"
  estimated_reading_time: "50-70 hours"
  completion_status: "Work in Progress"

  # Progressive example specification - LED Blink Evolution
  progressive_example:
    name: "LED Blink Evolution"
    description: "Single example (LED blink) implemented at each abstraction level to demonstrate complexity reduction and safety improvements"
    implementations:
      - level: "bare_metal"
        chapter: 1
        section: "01-02a"
        file: "book/project/bare_metal_blink.rs"
        complexity_score: 10
        lines_of_code: 50
        safety_features: "none"
        description: "Direct register manipulation with volatile reads/writes"

      - level: "pac"
        chapter: 2
        section: "02-04a"
        file: "book/project/pac_blink.rs"
        complexity_score: 7
        lines_of_code: 35
        safety_features: "type_safe_registers"
        description: "Type-safe register access via generated PAC"

      - level: "hal"
        chapter: 4
        section: "04-07a"
        file: "book/project/hal_blink.rs"
        complexity_score: 3
        lines_of_code: 15
        safety_features: "type_state_pattern,embedded_hal_traits"
        description: "High-level GPIO API with compile-time guarantees"

      - level: "bsp"
        chapter: 15
        section: "15-04a"
        file: "book/project/bsp_blink.rs"
        complexity_score: 1
        lines_of_code: 8
        safety_features: "board_specific_abstractions,zero_config"
        description: "Board-specific API with minimal boilerplate"

    pedagogical_goals:
      - "Demonstrate abstraction reducing complexity"
      - "Show safety improving with each layer"
      - "Prove Rust's zero-cost abstractions"
      - "Provide quantitative complexity comparison"

# Global book structure
book_structure:
  root_folder: "book/"
  latex_output: "book/latex/"
  project_code: "book/project/"
  diagrams_organization: "chapter_folders"  # Diagrams stored in chapters/chapter-XX/diagrams/
  build_system: "xelatex + tikz + minted for code highlighting"
  remote_compilation: true
  compilation_host: "containerized environment"
  code_font_size: "small"  # Use small fonts for code blocks to fit more content

# Book Parts Structure - ORGANIZED INTO 4 PARTS
parts:
  - id: "part-1"
    title: "Part I: PAC Generation and Foundation"
    description: "Peripheral Access Crate generation, build systems, and embedded Rust fundamentals"
    chapters: [1, 2, 3]
    estimated_pages: 100

  - id: "part-2"
    title: "Part II: Hardware Abstraction Layer (HAL)"
    description: "Implementing production-ready peripheral drivers with embedded-hal traits (GPIO, Clocks, Communication, Advanced Peripherals)"
    chapters: [4, 5, 6, 7, 8, 9]
    estimated_pages: 270

  - id: "part-3"
    title: "Part III: Wireless Protocol Stacks"
    description: "Radio Abstraction Interface Layer (RAIL), Bluetooth 5.3 LE, Zigbee 3.0, Thread, and Matter protocol implementations"
    chapters: [11, 12, 13, 14]
    estimated_pages: 205

  - id: "part-4"
    title: "Part IV: Testing, BSP, and Production"
    description: "Test-driven development, Board Support Packages, documentation strategies, production deployment, and ecosystem integration"
    chapters: [10, 15, 16, 17, 18]
    estimated_pages: 255

# Chapter structure with detailed metadata - INTEGRATED BUILD/FLASH EXAMPLES IN EVERY CHAPTER
