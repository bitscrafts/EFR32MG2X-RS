# Minimal OpenOCD target for EFR32MG24 (Cortex-M33) over the onboard CMSIS-DAP.
#
# NO FLASH DRIVER: this config exists only for MEMORY ACCESS (halt, read RAM
# and flash, write RAM). It cannot program the part, on purpose -- programming
# belongs to probe-rs / Simplicity Commander, which know the Series 2 flash
# controller, and a mistaken flash is how this board was lost before.
#
# Why it exists: probe-rs 0.32 can wedge its own CMSIS-DAP session (a stale DAP
# response queue: "Command ID in response does not match sent command ID")
# while OpenOCD still talks to the same probe. This gives a read path that does
# not require unplugging the board.
#
# Usage (read-only examples):
#   openocd -f interface/cmsis-dap.cfg -f scripts/openocd-mg24-mini.cfg \
#     -c "init; halt; mdw 0x4003C040 1; resume; shutdown"
#
# The DAP/TAP construction follows target/efm32.cfg from the OpenOCD tree:
#   swj_newdap <chip> cpu ... -> dap create <chip>.dap -chain-position <chip>.cpu

source [find target/swj-dp.tcl]

set _CHIPNAME mg24
# Cortex-M33 DPIDR as read from this die's debug port.
set _CPUTAPID 0x6ba02477

swj_newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_CPUTAPID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

adapter speed 1000

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -dap $_CHIPNAME.dap
