[build]
# Set default target for Cortex-M33 with hardware FPU
target = "thumbv8m.main-none-eabihf"

[target.thumbv8m.main-none-eabihf]
# Use ARM's link.x linker script from cortex-m-rt
# link.x will INCLUDE memory.x automatically - do NOT add -Tmemory.x here
runner = "probe-rs run --chip EFR32MG24B220F1536IM48"
#runner = "probe-rs run --chip EFR32MG24B220F1536"
rustflags = [
  "-C", "link-arg=-Tlink.x",
  # --nmagic: do not page-align sections/segments. Without it LLD emits a
  # PT_LOAD covering the ELF header with paddr rounded down to the 64 KiB page
  # boundary, i.e. a 372-byte segment at 0x08000000 -- inside the Gecko
  # bootloader region. probe-rs happens to skip that segment, but openocd,
  # Simplicity Commander and any naive ELF loader may not, and the image then
  # overwrites the bootloader's own vector table.
  "-C", "link-arg=--nmagic",
  # --allow-multiple-definition: the vendor's controller and host archives each contain an object defining the same
  # `bg_pool_pools` table (272 bytes, `OBJECT`, in both -- measured with `readelf -sW` on the extracted members). They
  # are one table compiled into both libraries, and they only collide once the controller's link-layer object is
  # actually pulled in, which requires the application to define `sl_bt_controller_init`. Taking the first definition
  # shares one pool, which is the vendor's design; the flag has to live here because a link argument set by a library's
  # build script does not reach the examples that link it.
  "-C", "link-arg=--allow-multiple-definition",
]

# Alternative runners (uncomment as needed)
# runner = "arm-none-eabi-gdb -q -x openocd.gdb"
# runner = "pyocd gdb --target efr32mg24 --"

[alias]
# Convenient aliases
rb = "build --release"
rr = "run --release"
size = "size --"
